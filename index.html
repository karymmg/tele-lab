<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA: prevent zoom, pinch, and horizontal overscroll -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#008CFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Tele Lab — Réparation de téléphone à domicile</title>
    <meta name="description" content="Tele Lab répare votre téléphone à domicile. Livraison gratuite, paiement en deux fois, suivi en temps réel." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ─── Splash / Loading Screen ────────────────────────────────── */
      #tl-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #03070A;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #tl-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      
      .electro-svg {
        width: 100%;
        max-width: 450px;
        height: auto;
        overflow: visible;
      }

      .electro-text-main {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 4rem;
        fill: transparent;
        stroke: #008CFF;
        stroke-width: 1.5px;
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: 
          drawText 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards,
          glowMain 1.5s ease-in-out 1.5s infinite alternate,
          fillMain 1s ease forwards 1.5s;
      }

      .electro-text-sub {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 1rem;
        letter-spacing: 0.15em;
        fill: transparent;
        stroke: #00A3FF;
        stroke-width: 0.5px;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: 
          drawText 1.5s cubic-bezier(0.25, 0.1, 0.25, 1) 0.8s forwards,
          fillSub 0.8s ease forwards 2s;
      }

      @keyframes drawText {
        to { stroke-dashoffset: 0; }
      }

      @keyframes fillMain {
        to { fill: #008CFF; stroke-width: 0; }
      }

      @keyframes fillSub {
        to { fill: rgba(167, 176, 184, 0.8); stroke-width: 0; }
      }

      @keyframes glowMain {
        0% { filter: drop-shadow(0 0 2px rgba(0, 140, 255, 0.2)); }
        100% { filter: drop-shadow(0 0 16px rgba(0, 163, 255, 0.6)); }
      }

      #tl-splash .tl-tagline {
        margin-top: 10px;
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        color: rgba(167, 176, 184, 0.4);
        letter-spacing: 0.05em;
        opacity: 0;
        animation: fadeIn 1s ease forwards 2.2s;
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen (removed by React after mount) -->
    <div id="tl-splash">
      <svg class="electro-svg" viewBox="0 0 500 150">
        <text x="50%" y="45%" text-anchor="middle" dominant-baseline="middle" class="electro-text-main">TELE LAB</text>
        <text x="50%" y="85%" text-anchor="middle" dominant-baseline="middle" class="electro-text-sub">BY TELEPHONIC PRO</text>
      </svg>
      <div class="tl-tagline">Réparation à domicile</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
