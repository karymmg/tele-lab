<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000000" />
  
  <defs>
    <filter id="glowRing" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0044ff" stroke-width="14" filter="url(#glowRing)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00a3ff" stroke-width="6" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />

  <!-- Letters TL -->
  <g transform="translate(130, 170)">
    <!-- T top bar -->
    <polygon points="0,0 210,0 190,50 20,50" fill="#ffffff" />
    <!-- T stem -->
    <polygon points="125,50 175,50 120,180 70,180" fill="#ffffff" />
    
    <!-- L stem -->
    <polygon points="190,90 230,90 185,180 145,180" fill="#0066ff" />
    <!-- L bottom bar -->
    <polygon points="185,130 300,130 280,180 145,180" fill="#0066ff" />
  </g>
</svg>
